databases:
  - name: speaking-opportunity-finder-db
    databaseName: speaking_opportunities
    user: app
    plan: free

services:
  # Backend API
  - type: web
    name: speaking-opportunity-finder-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cp prisma/schema.production.prisma prisma/schema.prisma && npx prisma generate && npx prisma db push && cd server && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: speaking-opportunity-finder-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_AUTO_SYNC
        value: true
      - key: WEB_SEARCH_API_KEY
        sync: false # Set manually in dashboard
      - key: CORS_ORIGIN
        value: https://speaking-opportunity-finder.onrender.com
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: speaking-opportunity-finder
    runtime: static
    buildCommand: npm install --include=dev && cd client && npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://speaking-opportunity-finder-api.onrender.com/api
